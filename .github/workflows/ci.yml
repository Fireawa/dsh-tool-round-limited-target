name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          # 用通配而不是写死文件名：文件被删/新增时不用改 workflow。
          # nullglob 让不匹配的模式展开为空数组，再逐项 -f 检查，避免 MODULE_NOT_FOUND。
          shopt -s nullglob
          files=(index.js lib/*.js *.mjs)
          checked=0
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            echo "check $file"
            node --check "$file"
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "没有找到待检查的源文件" >&2
            exit 1
          fi
          echo "checked $checked files"

      - name: 离线自检（不依赖 DSH）
        run: node selftest.mjs

      - name: 真实环境验证（没有本机 DSH 包时自动跳过）
        run: node verify-live.mjs
