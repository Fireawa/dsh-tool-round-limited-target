name: compat

# DSH 还是 0.x，内部约定（作用域优先级、命令名校验、definitionId 语义）可能变。
# 这个 workflow 每周一拉最新版 DSH，跑「真实环境验证 + 变异测试」当哨兵。
# 它不拦 PR，只在 Actions 里变红提醒你适配。

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  against-latest-dsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # DSH 的 engines 要求 node >= 24.9，用 22 会 EBADENGINE（装得上但跑不顺）
          node-version: 24

      - name: 安装最新版 DSH
        run: |
          # 不能写 `npm install -g @deepseek-ai/dsh`：不带版本号等价于 @*，
          # 而 semver 的 * 不匹配带 -rc/-alpha 的预发布版本，而 DSH 至今只有预发布版，
          # 于是会报 ETARGET「No matching version found」。必须显式走 latest 标签。
          npm install -g @deepseek-ai/dsh@latest

      - name: 真实环境验证 + 变异测试
        run: |
          export DSH_AI_DIR="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai"
          echo "DSH_AI_DIR=$DSH_AI_DIR"
          node verify-live.mjs
          node mutate.mjs
